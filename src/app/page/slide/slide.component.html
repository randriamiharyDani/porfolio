<section class="relative flex min-h-[22rem] items-center justify-center overflow-hidden bg-night-900">
  <app-mini-cosmos></app-mini-cosmos>
  <div class="pointer-events-none absolute inset-0 bg-gradient-to-r from-cyan-500/15 via-transparent to-violet-600/15"></div>

  <div data-reveal class="relative z-10 flex flex-col items-center gap-5 px-6 text-center">
    <span class="flex items-center gap-2 rounded-full border border-emerald-400/30 bg-emerald-400/10 px-4 py-1.5 text-sm font-semibold text-emerald-300">
      <span class="relative flex h-2.5 w-2.5">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
      </span>
      {{ 'SLIDE.TITLE' | translate }}
    </span>

    <h2 class="font-display text-2xl font-bold text-white sm:text-4xl">
      <span class="texte">{{ 'SLIDE.TEXT' | translate }}</span>
    </h2>

    <a href="#contact" class="btn-gradient mt-2 rounded-xl px-6 py-3 text-sm font-semibold text-white">
      {{ 'SLIDE.CTA' | translate }}
    </a>
  </div>
</section>
