<section id="projets" class="relative overflow-hidden bg-night-950 py-24 sm:py-32">
  <div class="pointer-events-none absolute left-1/2 top-0 h-px w-2/3 -translate-x-1/2 bg-gradient-to-r from-transparent via-cyan-400/40 to-transparent"></div>

  <div class="container mx-auto px-6 lg:px-10">
    <!-- Header -->
    <div class="mx-auto max-w-3xl text-center">
      <div data-reveal class="justify-center chip">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" /></svg>
        {{ 'PROJECT.CHIP' | translate }}
      </div>
      <h2 data-reveal data-delay="80" class="section-title mt-5">
        {{ 'PROJECT.TITLE1' | translate }} <span class="text-gradient">{{ 'PROJECT.TITLE2' | translate }}</span>
      </h2>
      <p data-reveal data-delay="160" class="mt-4 text-slate-400">{{ 'PROJECT.SUB' | translate }}</p>
    </div>

    <!-- Grille -->
    <div data-reveal class="mt-16 grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
      <div *ngFor="let project of projects"
        class="group relative overflow-hidden rounded-3xl border border-white/10 bg-white/5">
        <!-- Image -->
        <div class="relative h-56 overflow-hidden">
          <img [src]="project.image" [alt]="project.title | translate"
            class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110" />
          <div class="absolute inset-0 bg-gradient-to-t from-night-950 via-night-950/30 to-transparent"></div>
        </div>

        <!-- Contenu -->
        <div class="relative -mt-14 p-6">
          <h3 class="font-display text-xl font-bold text-white transition-colors group-hover:text-cyan-300">{{ project.title | translate }}</h3>
          <p class="mt-2 text-sm leading-relaxed text-slate-400">{{ project.desc | translate }}</p>

          <div class="mt-4 flex flex-wrap gap-2">
            <span *ngFor="let tag of project.tags" class="rounded-md bg-cyan-500/10 px-2.5 py-1 text-xs font-semibold text-cyan-300 ring-1 ring-cyan-400/20">{{ tag }}</span>
          </div>

          <div class="mt-5 flex gap-3">
            <a *ngIf="project.github" [href]="project.github" target="_blank" rel="noopener"
              class="flex items-center gap-2 rounded-lg bg-white/10 px-4 py-2 text-xs font-semibold text-white transition-colors hover:bg-gradient-to-r hover:from-cyan-500 hover:to-violet-600">
              <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.4 7.86 10.92.58.11.79-.25.79-.55v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.52-1.32-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.02 1.76 2.69 1.25 3.35.95.1-.74.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 015.74 0c2.18-1.49 3.14-1.18 3.14-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14v3.18c0 .31.21.67.8.55A10.52 10.52 0 0023.5 12C23.5 5.65 18.35.5 12 .5z" /></svg>
              {{ 'PROJECT.VIEW_CODE' | translate }}
            </a>
            <a *ngIf="project.demo" [href]="project.demo" target="_blank" rel="noopener"
              class="flex items-center gap-2 rounded-lg bg-white/10 px-4 py-2 text-xs font-semibold text-white transition-colors hover:bg-gradient-to-r hover:from-cyan-500 hover:to-violet-600">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
              {{ 'PROJECT.DEMO' | translate }}
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
