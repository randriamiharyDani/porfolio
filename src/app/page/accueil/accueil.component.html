<section class="relative flex min-h-screen min-h-svh items-center overflow-hidden bg-night-950" id="accueil">
  <app-cosmos></app-cosmos>

  <!-- Overlays -->
  <div class="pointer-events-none absolute inset-0 bg-gradient-to-br from-cyan-500/10 via-transparent to-violet-600/10"></div>
  <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-night-950 via-night-950/40 to-night-950/70"></div>
  <div class="pointer-events-none absolute inset-0 opacity-[0.07] [background-image:linear-gradient(to_right,#fff_1px,transparent_1px),linear-gradient(to_bottom,#fff_1px,transparent_1px)] [background-size:56px_56px] [mask-image:radial-gradient(ellipse_at_center,black,transparent_75%)]"></div>
  <div class="pointer-events-none absolute -left-32 top-24 h-96 w-96 animate-blob rounded-full bg-cyan-500/20 blur-3xl max-sm:hidden"></div>
  <div class="pointer-events-none absolute -right-24 bottom-10 h-96 w-96 animate-blob rounded-full bg-violet-600/20 blur-3xl max-sm:hidden" style="animation-delay: 3s"></div>

  <div class="relative z-10 container mx-auto grid items-center gap-8 px-5 pb-24 pt-16 sm:gap-14 sm:px-6 sm:py-28 lg:grid-cols-2 lg:px-10 lg:py-0">
    <!-- Texte -->
    <div class="order-2 text-center lg:order-1 lg:text-left">
      <div data-reveal class="chip">
        <span class="relative flex h-2.5 w-2.5">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
        </span>
        {{ 'ACCUEIL.AVAILABLE' | translate }}
      </div>

      <p data-reveal data-delay="80" class="mt-6 font-display text-xl font-medium text-slate-300">
        {{ 'ACCUEIL.HELLO' | translate }} <span class="inline-block animate-wave origin-[70%_70%]">👋</span>
      </p>

      <h1 data-reveal data-delay="160" class="mt-2 break-words font-display text-4xl font-bold leading-tight text-white max-[380px]:text-3xl sm:text-6xl">
        <span class="text-gradient">{{ 'ACCUEIL.NAME' | translate }}</span>
      </h1>

      <div data-reveal data-delay="240"
           class="mt-5 flex min-h-10 flex-wrap items-center justify-center gap-x-1 font-mono text-lg font-semibold text-cyan-300 max-[380px]:text-base sm:text-2xl lg:justify-start"
           aria-live="polite">
        <span class="text-slate-500">&lt;</span>
        <span class="whitespace-nowrap text-white">{{ typedText }}</span>
        <span class="caret"></span>
        <span class="ml-1 text-slate-500">/&gt;</span>
      </div>

      <p data-reveal data-delay="320" class="mx-auto mt-6 max-w-xl text-base leading-relaxed text-slate-400 lg:mx-0">
        {{ 'ACCUEIL.DESC' | translate }}
      </p>

      <!-- CTA -->
      <div data-reveal data-delay="400" class="mt-8 flex w-full max-w-md flex-col items-stretch justify-center gap-3 sm:w-auto sm:max-w-none sm:flex-row sm:flex-wrap sm:items-center sm:gap-4 lg:justify-start">
        <a href="#projets"
           class="btn-gradient group inline-flex items-center gap-2 rounded-xl px-7 py-3 font-semibold text-white shadow-xl shadow-cyan-500/20 transition-transform duration-300 hover:-translate-y-0.5">
          {{ 'ACCUEIL.CTA_PROJECTS' | translate }}
          <svg class="h-4 w-4 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5-5 5M6 12h12" />
          </svg>
        </a>
        <a href="#contact"
           class="inline-flex items-center gap-2 rounded-xl border border-white/15 bg-white/5 px-7 py-3 font-semibold text-white backdrop-blur transition duration-300 hover:-translate-y-0.5 hover:border-cyan-400/60 hover:bg-cyan-400/10">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l9 6 9-6M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
          {{ 'ACCUEIL.CTA_CONTACT' | translate }}
        </a>
      </div>

      <!-- Réseaux sociaux -->
      <div data-reveal data-delay="480" class="mt-9 flex items-center justify-center gap-4 lg:justify-start">
        <span class="hidden h-px w-10 bg-gradient-to-r from-cyan-400/60 to-transparent lg:block"></span>
        <div class="flex items-center gap-3">
          <a href="https://github.com/randriamiharyDani?tab=repositories" target="_blank" rel="noopener" aria-label="GitHub"
             class="social-btn transition duration-300 hover:-translate-y-1 hover:border-cyan-400/60 hover:text-cyan-300">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.4 7.86 10.92.58.11.79-.25.79-.55v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.52-1.32-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.02 1.76 2.69 1.25 3.35.95.1-.74.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 015.74 0c2.18-1.49 3.14-1.18 3.14-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14v3.18c0 .31.21.67.8.55A10.52 10.52 0 0023.5 12C23.5 5.65 18.35.5 12 .5z" /></svg>
          </a>
          <a href="#" aria-label="LinkedIn"
             class="social-btn transition duration-300 hover:-translate-y-1 hover:border-sky-400/60 hover:text-sky-300">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 110-4.12 2.06 2.06 0 010 4.12zM7.12 20.45H3.55V9h3.57v11.45z" /></svg>
          </a>
          <a href="https://www.facebook.com/stevs.daniimady/" target="_blank" rel="noopener" aria-label="Facebook"
             class="social-btn transition duration-300 hover:-translate-y-1 hover:border-violet-400/60 hover:text-violet-300">
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.4 22v-8.3h2.8l.42-3.25h-3.22V8.4c0-.94.26-1.58 1.61-1.58h1.72V3.84c-.3-.04-1.32-.13-2.5-.13-2.48 0-4.17 1.51-4.17 4.29v2.42H7.1v3.25h2.95V22H13.4z" /></svg>
          </a>
        </div>
      </div>
    </div>

    <!-- Portrait -->
    <div data-reveal data-delay="200" class="order-1 flex justify-center lg:order-2">
      <div class="group relative">
        <img [src]="imagePath" alt="Randriamihary Dani" class="hero-photo transition-transform duration-700 group-hover:scale-[1.04]"
             fetchpriority="high" decoding="async" />
      </div>
    </div>
  </div>

  <!-- Scroll indicator -->
  <a href="#profil" class="scroll-indicator absolute bottom-6 left-1/2 z-10 flex -translate-x-1/2 flex-col items-center gap-2 text-slate-400 transition-colors hover:text-cyan-300" aria-label="Scroll">
    <span class="flex h-12 w-7 items-start justify-center rounded-full border-2 border-current p-1.5">
      <span class="scroll-dot"></span>
    </span>
  </a>
</section>
