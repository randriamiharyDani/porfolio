<section id="profil" class="relative overflow-hidden py-24 sm:py-32">
  <div class="pointer-events-none absolute -right-40 top-0 h-96 w-96 rounded-full bg-violet-600/10 blur-3xl"></div>
  <div class="pointer-events-none absolute -left-40 bottom-0 h-80 w-80 rounded-full bg-cyan-500/10 blur-3xl"></div>

  <div class="container mx-auto grid items-center gap-14 px-6 lg:grid-cols-2 lg:px-10">
    <!-- Illustration avec logos orbitaux -->
    <div data-reveal class="profile-illustration relative flex justify-center">
      <div class="orbit-container">
        <div class="pointer-events-none absolute -inset-10 rounded-full bg-gradient-to-tr from-cyan-500/15 to-violet-600/15 blur-2xl"></div>

        <div class="orbit-ring orbit-ring-1">
          <div *ngFor="let logo of orbit1; let i = index; trackBy: trackByName" class="logo-node"
               [style.transform]="'rotate(' + (360 / orbit1.length * i) + 'deg) translateY(-172px)'">
            <div class="logo-counter">
              <div class="logo-face" [title]="logo.label">
                <img [src]="logo.logo" [alt]="logo.label" class="logo-icon"
                     loading="lazy" width="200" height="200" />
              </div>
            </div>
          </div>
        </div>

        <div class="orbit-ring orbit-ring-2">
          <div *ngFor="let logo of orbit2; let i = index; trackBy: trackByName" class="logo-node"
               [style.transform]="'rotate(' + (360 / orbit2.length * i) + 'deg) translateY(-274px)'">
            <div class="logo-counter">
              <div class="logo-face logo-face--sm" [title]="logo.label">
                <img [src]="logo.logo" [alt]="logo.label" class="logo-icon"
                     loading="lazy" width="200" height="200" />
              </div>
            </div>
          </div>
        </div>

        <div class="photo-wrapper glass">
          <img src="/assets/profile.jpg" alt="Photo de profil" class="profile-photo" />
          <div class="pointer-events-none absolute inset-0 rounded-full ring-1 ring-white/15"></div>
        </div>
      </div>

      <div class="profile-badge glass absolute -bottom-6 left-1/2 z-20 flex -translate-x-1/2 items-center gap-4 whitespace-nowrap rounded-2xl px-6 py-3 shadow-xl">
        <span class="relative flex h-3 w-3">
          <span class="absolute inline-flex h-3 w-3 animate-ping rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex h-3 w-3 rounded-full bg-emerald-400"></span>
        </span>
        <span class="font-display text-sm font-semibold text-white">{{ 'PROFIL.BADGE' | translate }}</span>
      </div>
    </div>

    <!-- Contenu -->
    <div class="profile-content">
      <div data-reveal class="chip">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        {{ 'PROFIL.CHIP' | translate }}
      </div>

      <h2 data-reveal data-delay="80" class="section-title mt-5">
        {{ 'PROFIL.TITLE1' | translate }} <span class="text-gradient">{{ 'PROFIL.TITLE2' | translate }}</span>
      </h2>

      <div data-reveal data-delay="120" class="mt-4 h-px w-24 bg-gradient-to-r from-cyan-400 to-violet-500"></div>

      <p data-reveal data-delay="160" class="profile-paragraph mt-6 text-base leading-relaxed text-slate-400">
        {{ 'PROFIL.PARAGRAPHE' | translate }}
      </p>

      <!-- Points forts -->
      <div data-reveal class="profile-points mt-8 grid gap-3 sm:grid-cols-2">
        <div *ngFor="let point of points"
             class="glass flex items-center gap-3 rounded-xl px-4 py-3 transition duration-300 hover:-translate-y-1 hover:border-cyan-400/30 hover:shadow-lg hover:shadow-cyan-500/10">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-cyan-500/25 to-violet-600/25 text-cyan-300">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
          </span>
          <span class="text-sm font-medium text-slate-200">{{ point | translate }}</span>
        </div>
      </div>

      <!-- Stats -->
      <div data-reveal data-delay="220" class="profile-stats mt-10 grid grid-cols-2 gap-4 sm:grid-cols-4">
        <div *ngFor="let stat of stats"
             class="glass group rounded-2xl px-3 py-5 text-center transition duration-300 hover:-translate-y-1 hover:shadow-lg hover:shadow-violet-500/10">
          <p class="font-display text-3xl font-bold text-gradient sm:text-4xl">{{ stat.value }}</p>
          <p class="mt-1 text-[11px] font-medium uppercase tracking-wider text-slate-400 transition-colors group-hover:text-slate-200">
            {{ stat.key | translate }}
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
