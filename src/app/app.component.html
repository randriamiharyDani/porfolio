@if (loading) {
  <div class="fixed inset-0 z-[100] flex flex-col items-center justify-center gap-8 bg-night-950">
    <div class="relative flex h-28 w-28 items-center justify-center">
      <div class="absolute inset-0 animate-spin rounded-full border-4 border-transparent border-t-cyan-400 border-r-violet-500"></div>
      <div class="absolute inset-3 animate-spin rounded-full border-4 border-transparent border-b-indigo-400 [animation-direction:reverse]" style="animation-duration: 1.4s"></div>
      <span class="font-display text-3xl font-bold text-white">D<span class="text-cyan-400">.</span></span>
    </div>
    <p class="font-display text-sm uppercase tracking-[0.3em] text-slate-400 animate-pulse">Dani.dev</p>
  </div>
} @else {
  <div class="animate-fade-up">
    <router-outlet />
  </div>
}
